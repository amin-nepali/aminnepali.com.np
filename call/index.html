<script>
    class P2PChatApp {
        constructor() {
            this.roomId = this.generateRoomId();
            this.userId = this.generateUserId();
            this.isHost = false;
            this.peerConnection = null;
            this.dataChannel = null;
            this.localStream = null;
            this.isVideoEnabled = false;
            this.isVoiceEnabled = false;
            this.isConnected = false;
            this.signalingData = {};

            this.initializeElements();
            this.setupEventListeners();
            this.initializeSignaling();
            this.startConnection();
        }

        generateRoomId() {
            return Math.random().toString(36).substr(2, 6).toUpperCase();
        }

        generateUserId() {
            return Math.random().toString(36).substr(2, 8);
        }

        initializeElements() {
            this.elements = {
                messages: document.getElementById('messages'),
                messageInput: document.getElementById('messageInput'),
                sendBtn: document.getElementById('sendBtn'),
                voiceBtn: document.getElementById('voiceBtn'),
                videoBtn: document.getElementById('videoBtn'),
                localVideo: document.getElementById('localVideo'),
                remoteVideo: document.getElementById('remoteVideo'),
                localPlaceholder: document.getElementById('localPlaceholder'),
                remotePlaceholder: document.getElementById('remotePlaceholder'),
                statusText: document.getElementById('statusText'),
                statusIndicator: document.getElementById('statusIndicator'),
                roomCode: document.getElementById('roomCode'),
                connectionStatus: document.getElementById('connectionStatus')
            };

            this.elements.roomCode.textContent = this.roomId;
        }

        setupEventListeners() {
            this.elements.sendBtn.addEventListener('click', () => this.sendMessage());
            this.elements.messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') this.sendMessage();
            });
            this.elements.voiceBtn.addEventListener('click', () => this.toggleVoice());
            this.elements.videoBtn.addEventListener('click', () => this.toggleVideo());
        }

        // Simulate signaling server using localStorage for same-browser demo
        initializeSignaling() {
            // Clear old signaling data
            Object.keys(localStorage).forEach(key => {
                if (key.startsWith('p2p_signal_')) {
                    const data = JSON.parse(localStorage.getItem(key));
                    if (Date.now() - data.timestamp > 30000) { // 30 seconds timeout
                        localStorage.removeItem(key);
                    }
                }
            });

            // Check for existing room
            const existingRoom = localStorage.getItem(`p2p_room_${this.roomId}`);
            if (existingRoom) {
                const roomData = JSON.parse(existingRoom);
                if (roomData.users.length < 2) {
                    // Join existing room
                    roomData.users.push(this.userId);
                    localStorage.setItem(`p2p_room_${this.roomId}`, JSON.stringify(roomData));
                    this.isHost = false;
                }
            } else {
                // Create new room
                const roomData = {
                    id: this.roomId,
                    users: [this.userId],
                    created: Date.now()
                };
                localStorage.setItem(`p2p_room_${this.roomId}`, JSON.stringify(roomData));
                this.isHost = true;
            }

            // Start polling for signaling messages
            this.startSignalingPoll();
        }

        startSignalingPoll() {
            setInterval(() => {
                this.checkForSignalingMessages();
                this.checkForPeerConnection();
            }, 1000);
        }

        checkForPeerConnection() {
            const roomData = localStorage.getItem(`p2p_room_${this.roomId}`);
            if (roomData) {
                const room = JSON.parse(roomData);
                if (room.users.length === 2 && !this.isConnected) {
                    this.elements.connectionStatus.innerHTML = 'Peer found! Establishing connection...';
                    this.updateStatus('waiting', 'Connecting...');
                    
                    if (!this.peerConnection) {
                        this.initializePeerConnection();
                    }
                }
            }
        }

        checkForSignalingMessages() {
            const messageKey = `p2p_signal_${this.roomId}_${this.userId}`;
            const message = localStorage.getItem(messageKey);
            
            if (message) {
                const data = JSON.parse(message);
                this.handleSignalingMessage(data);
                localStorage.removeItem(messageKey);
            }
        }

        sendSignalingMessage(data) {
            const roomData = localStorage.getItem(`p2p_room_${this.roomId}`);
            if (roomData) {
                const room = JSON.parse(roomData);
                const otherUser = room.users.find(user => user !== this.userId);
                
                if (otherUser) {
                    const messageKey = `p2p_signal_${this.roomId}_${otherUser}`;
                    localStorage.setItem(messageKey, JSON.stringify({
                        ...data,
                        from: this.userId,
                        timestamp: Date.now()
                    }));
                }
            }
        }

        async handleSignalingMessage(data) {
            try {
                switch (data.type) {
                    case 'offer':
                        await this.handleOffer(data.offer);
                        break;
                    case 'answer':
                        await this.handleAnswer(data.answer);
                        break;
                    case 'ice-candidate':
                        await this.handleIceCandidate(data.candidate);
                        break;
                }
            } catch (error) {
                console.error('Error handling signaling message:', error);
            }
        }

        async startConnection() {
            // Wait a bit to see if room fills up
            setTimeout(async () => {
                const roomData = localStorage.getItem(`p2p_room_${this.roomId}`);
                if (roomData) {
                    const room = JSON.parse(roomData);
                    if (room.users.length === 2) {
                        await this.initializePeerConnection();
                        if (this.isHost) {
                            await this.createOffer();
                        }
                    }
                }
            }, 2000);
        }

        async initializePeerConnection() {
            try {
                this.peerConnection = new RTCPeerConnection({
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                });

                // Create data channel for host
                if (this.isHost) {
                    this.dataChannel = this.peerConnection.createDataChannel('chat', {
                        ordered: true
                    });
                    this.setupDataChannel(this.dataChannel);
                }

                // Handle incoming data channel
                this.peerConnection.ondatachannel = (event) => {
                    this.dataChannel = event.channel;
                    this.setupDataChannel(this.dataChannel);
                };

                // Handle remote stream
                this.peerConnection.ontrack = (event) => {
                    this.elements.remoteVideo.srcObject = event.streams[0];
                    this.elements.remoteVideo.style.display = 'block';
                    this.elements.remotePlaceholder.style.display = 'none';
                };

                // Handle ICE candidates
                this.peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        this.sendSignalingMessage({
                            type: 'ice-candidate',
                            candidate: event.candidate
                        });
                    }
                };

                // Handle connection state changes
                this.peerConnection.onconnectionstatechange = () => {
                    console.log('Connection state:', this.peerConnection.connectionState);
                    if (this.peerConnection.connectionState === 'connected') {
                        this.onPeerConnected();
                    } else if (this.peerConnection.connectionState === 'disconnected' || 
                             this.peerConnection.connectionState === 'failed') {
                        this.onPeerDisconnected();
                    }
                };

            } catch (error) {
                console.error('Error initializing peer connection:', error);
                this.addMessage('System', 'Failed to initialize connection', 'system');
            }
        }

        setupDataChannel(channel) {
            channel.onopen = () => {
                this.onPeerConnected();
            };

            channel.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'message') {
                        this.addMessage('Peer', data.content, 'other');
                    }
                } catch (error) {
                    console.error('Error parsing message:', error);
                }
            };

            channel.onclose = () => {
                this.onPeerDisconnected();
            };

            channel.onerror = (error) => {
                console.error('Data channel error:', error);
            };
        }

        async createOffer() {
            try {
                const offer = await this.peerConnection.createOffer();
                await this.peerConnection.setLocalDescription(offer);
                
                this.sendSignalingMessage({
                    type: 'offer',
                    offer: offer
                });
            } catch (error) {
                console.error('Error creating offer:', error);
            }
        }

        async handleOffer(offer) {
            try {
                await this.peerConnection.setRemoteDescription(offer);
                const answer = await this.peerConnection.createAnswer();
                await this.peerConnection.setLocalDescription(answer);
                
                this.sendSignalingMessage({
                    type: 'answer',
                    answer: answer
                });
            } catch (error) {
                console.error('Error handling offer:', error);
            }
        }

        async handleAnswer(answer) {
            try {
                await this.peerConnection.setRemoteDescription(answer);
            } catch (error) {
                console.error('Error handling answer:', error);
            }
        }

        async handleIceCandidate(candidate) {
            try {
                await this.peerConnection.addIceCandidate(candidate);
            } catch (error) {
                console.error('Error handling ICE candidate:', error);
            }
        }

        onPeerConnected() {
            this.isConnected = true;
            this.updateStatus('connected', 'Connected');
            this.enableControls();
            this.elements.connectionStatus.textContent = 'Connected to peer';
            this.addMessage('System', '🎉 Connected! You can now chat in real-time.', 'system');
        }

        onPeerDisconnected() {
            this.isConnected = false;
            this.updateStatus('waiting', 'Disconnected');
            this.disableControls();
            this.elements.connectionStatus.textContent = 'Peer disconnected';
            this.addMessage('System', '❌ Peer disconnected.', 'system');
        }

        enableControls() {
            this.elements.messageInput.disabled = false;
            this.elements.messageInput.placeholder = 'Type your message...';
            this.elements.sendBtn.disabled = false;
            this.elements.voiceBtn.disabled = false;
            this.elements.videoBtn.disabled = false;
        }

        disableControls() {
            this.elements.messageInput.disabled = true;
            this.elements.messageInput.placeholder = 'Not connected...';
            this.elements.sendBtn.disabled = true;
            this.elements.voiceBtn.disabled = true;
            this.elements.videoBtn.disabled = true;
        }

        updateStatus(status, text) {
            this.elements.statusIndicator.className = `status-indicator ${status}`;
            this.elements.statusText.textContent = text;
        }

        sendMessage() {
            const input = this.elements.messageInput;
            const message = input.value.trim();
            
            if (message && this.isConnected && this.dataChannel && this.dataChannel.readyState === 'open') {
                this.addMessage('You', message, 'own');
                
                this.dataChannel.send(JSON.stringify({
                    type: 'message',
                    content: message,
                    timestamp: Date.now()
                }));
                
                input.value = '';
            }
        }

        addMessage(sender, content, type) {
            const messagesContainer = this.elements.messages;
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            messageDiv.innerHTML = `
                <div class="message-bubble">
                    ${type === 'system' ? content : `<strong>${sender}:</strong> ${content}`}
                </div>
                <div class="message-time">${time}</div>
            `;
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        async toggleVoice() {
            try {
                if (!this.isVoiceEnabled) {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        audio: true,
                        video: this.isVideoEnabled 
                    });
                    
                    this.localStream = stream;
                    
                    // Add audio track to peer connection
                    const audioTrack = stream.getAudioTracks()[0];
                    if (this.peerConnection) {
                        this.peerConnection.addTrack(audioTrack, stream);
                    }
                    
                    this.isVoiceEnabled = true;
                    this.elements.voiceBtn.classList.add('active');
                    this.addMessage('System', '🎤 Voice enabled', 'system');
                } else {
                    if (this.localStream) {
                        this.localStream.getAudioTracks().forEach(track => {
                            track.stop();
                            if (this.peerConnection) {
                                const sender = this.peerConnection.getSenders().find(s => s.track === track);
                                if (sender) this.peerConnection.removeTrack(sender);
                            }
                        });
                    }
                    this.isVoiceEnabled = false;
                    this.elements.voiceBtn.classList.remove('active');
                    this.addMessage('System', '🔇 Voice disabled', 'system');
                }
            } catch (error) {
                console.error('Voice toggle error:', error);
                this.addMessage('System', '❌ Could not access microphone', 'system');
            }
        }

        async toggleVideo() {
            try {
                if (!this.isVideoEnabled) {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: true, 
                        audio: this.isVoiceEnabled 
                    });
                    
                    this.localStream = stream;
                    this.elements.localVideo.srcObject = stream;
                    this.elements.localVideo.style.display = 'block';
                    this.elements.localPlaceholder.style.display = 'none';
                    
                    // Add video track to peer connection
                    const videoTrack = stream.getVideoTracks()[0];
                    if (this.peerConnection) {
                        this.peerConnection.addTrack(videoTrack, stream);
                    }
                    
                    this.isVideoEnabled = true;
                    this.elements.videoBtn.classList.add('active');
                    this.addMessage('System', '📹 Video enabled', 'system');
                } else {
                    if (this.localStream) {
                        this.localStream.getVideoTracks().forEach(track => {
                            track.stop();
                            if (this.peerConnection) {
                                const sender = this.peerConnection.getSenders().find(s => s.track === track);
                                if (sender) this.peerConnection.removeTrack(sender);
                            }
                        });
                    }
                    this.elements.localVideo.style.display = 'none';
                    this.elements.localPlaceholder.style.display = 'flex';
                    this.elements.localPlaceholder.textContent = 'Camera Off';
                    this.isVideoEnabled = false;
                    this.elements.videoBtn.classList.remove('active');
                    this.addMessage('System', '📷 Video disabled', 'system');
                }
            } catch (error) {
                console.error('Video toggle error:', error);
                this.addMessage('System', '❌ Could not access camera', 'system');
            }
        }
    }

    // Initialize the chat app when page loads
    document.addEventListener('DOMContentLoaded', () => {
        new P2PChatApp();
    });

    // Cleanup on page unload
    window.addEventListener('beforeunload', () => {
        // Clean up the room when user leaves
        const roomId = window.chatApp?.roomId;
        if (roomId) {
            localStorage.removeItem(`p2p_room_${roomId}`);
        }
    });
</script>

<script>
    class DirectP2PChat {
        constructor() {
            this.userId = this.generateUserId();
            this.peerConnection = null;
            this.dataChannel = null;
            this.localStream = null;
            this.isVideoEnabled = false;
            this.isVoiceEnabled = false;
            this.isConnected = false;
            this.ws = null;
            this.isHost = false;
            this.connectionAttempts = 0;
            this.maxRetries = 5;

            this.initializeElements();
            this.setupEventListeners();
            this.connectToSignalingServer();
        }

        generateUserId() {
            return 'user_' + Math.random().toString(36).substr(2, 12);
        }

        initializeElements() {
            this.elements = {
                messages: document.getElementById('messages'),
                messageInput: document.getElementById('messageInput'),
                sendBtn: document.getElementById('sendBtn'),
                voiceBtn: document.getElementById('voiceBtn'),
                videoBtn: document.getElementById('videoBtn'),
                localVideo: document.getElementById('localVideo'),
                remoteVideo: document.getElementById('remoteVideo'),
                localPlaceholder: document.getElementById('localPlaceholder'),
                remotePlaceholder: document.getElementById('remotePlaceholder'),
                statusText: document.getElementById('statusText'),
                statusIndicator: document.getElementById('statusIndicator'),
                userId: document.getElementById('userId'),
                connectionStatus: document.getElementById('connectionStatus'),
                retryBtn: document.getElementById('retryBtn')
            };

            this.elements.userId.textContent = this.userId;
        }

        setupEventListeners() {
            this.elements.sendBtn.addEventListener('click', () => this.sendMessage());
            this.elements.messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') this.sendMessage();
            });
            this.elements.voiceBtn.addEventListener('click', () => this.toggleVoice());
            this.elements.videoBtn.addEventListener('click', () => this.toggleVideo());
            this.elements.retryBtn.addEventListener('click', () => this.retryConnection());
        }

        async connectToSignalingServer() {
            try {
                this.addMessage('System', '🌐 Connecting to signaling server...', 'system');
                await this.initializeFirebaseSignaling();
            } catch (error) {
                console.error('Signaling server connection failed:', error);
                this.addMessage('System', '❌ Failed to connect to signaling server. Retrying...', 'system');
                
                setTimeout(() => {
                    if (this.connectionAttempts < this.maxRetries) {
                        this.connectionAttempts++;
                        this.connectToSignalingServer();
                    } else {
                        this.showRetryButton();
                    }
                }, 3000);
            }
        }

        async initializeFirebaseSignaling() {
            this.addMessage('System', '✅ Connected to signaling service', 'system');
            this.updateStatus('searching', 'Searching for peers...');
            this.startPeerDiscovery();
        }

        async startPeerDiscovery() {
            const discoveryId = 'p2p_chat_' + Date.now().toString(36);
            const existingSessions = this.getStoredSessions();
            
            if (existingSessions.length > 0) {
                const session = existingSessions[0];
                this.addMessage('System', '👥 Found peer! Connecting...', 'system');
                await this.joinSession(session);
            } else {
                this.createSession(discoveryId);
                this.addMessage('System', '⏳ Waiting for someone to join...', 'system');
                this.pollForPeers(discoveryId);
            }
        }

        getStoredSessions() {
            const sessions = [];
            const now = Date.now();
            
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('p2p_session_')) {
                    try {
                        const session = JSON.parse(localStorage.getItem(key));
                        if (now - session.created < 30000 && session.userId !== this.userId) {
                            sessions.push(session);
                        }
                    } catch (error) {
                        localStorage.removeItem(key);
                    }
                }
            }
            
            return sessions;
        }

        createSession(sessionId) {
            const session = {
                id: sessionId,
                userId: this.userId,
                created: Date.now(),
                status: 'waiting'
            };
            
            localStorage.setItem(`p2p_session_${sessionId}`, JSON.stringify(session));
            this.sessionId = sessionId;
            this.isHost = true;
        }

        async joinSession(session) {
            this.sessionId = session.id;
            this.isHost = false;
            
            const updatedSession = {
                ...session,
                joined: true,
                peerUserId: this.userId
            };
            localStorage.setItem(`p2p_session_${session.id}`, JSON.stringify(updatedSession));
            
            await this.initializePeerConnection();
            
            setTimeout(() => {
                this.createOffer();
            }, 1000);
        }

        pollForPeers(sessionId) {
            const pollInterval = setInterval(() => {
                const session = localStorage.getItem(`p2p_session_${sessionId}`);
                
                if (session) {
                    const sessionData = JSON.parse(session);
                    
                    if (sessionData.joined && sessionData.peerUserId !== this.userId) {
                        clearInterval(pollInterval);
                        this.addMessage('System', '🎯 Peer joined! Establishing connection...', 'system');
                        this.initializePeerConnection();
                    }
                }
            }, 1000);

            setTimeout(() => {
                clearInterval(pollInterval);
                if (!this.isConnected) {
                    this.addMessage('System', '⏰ No peers found. Try refreshing the page.', 'system');
                    this.showRetryButton();
                }
            }, 60000);
        }

        async initializePeerConnection() {
            try {
                this.peerConnection = new RTCPeerConnection({
                    iceServers: [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                        { urls: 'stun:stun2.l.google.com:19302' }
                    ]
                });

                this.dataChannel = this.peerConnection.createDataChannel('chat');
                this.setupDataChannel(this.dataChannel);

                this.peerConnection.ondatachannel = (event) => {
                    this.setupDataChannel(event.channel);
                };

                this.peerConnection.ontrack = (event) => {
                    this.elements.remoteVideo.srcObject = event.streams[0];
                    this.elements.remoteVideo.style.display = 'block';
                    this.elements.remotePlaceholder.style.display = 'none';
                };

                this.peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        this.sendSignalingMessage('ice-candidate', {
                            candidate: event.candidate
                        });
                    }
                };

                this.peerConnection.onconnectionstatechange = () => {
                    console.log('Connection state:', this.peerConnection.connectionState);
                    if (this.peerConnection.connectionState === 'connected') {
                        this.onPeerConnected();
                    } else if (this.peerConnection.connectionState === 'failed') {
                        this.onConnectionFailed();
                    }
                };

                this.updateStatus('searching', 'Establishing connection...');

            } catch (error) {
                console.error('Error initializing peer connection:', error);
                this.addMessage('System', '❌ Connection setup failed', 'system');
            }
        }

        setupDataChannel(channel) {
            channel.onopen = () => {
                this.onPeerConnected();
            };

            channel.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'message') {
                        this.addMessage('Peer', data.content, 'other');
                    }
                } catch (error) {
                    console.error('Error parsing message:', error);
                }
            };

            channel.onclose = () => {
                this.onPeerDisconnected();
            };
        }

        async createOffer() {
            try {
                const offer = await this.peerConnection.createOffer();
                await this.peerConnection.setLocalDescription(offer);
                
                this.sendSignalingMessage('offer', { offer: offer });
            } catch (error) {
                console.error('Error creating offer:', error);
            }
        }

        sendSignalingMessage(type, data) {
            const message = {
                type: type,
                data: data,
                from: this.userId,
                timestamp: Date.now()
            };

            const messageKey = `p2p_signal_${this.sessionId}_${Date.now()}`;
            localStorage.setItem(messageKey, JSON.stringify(message));

            if (!this.signalingPoll) {
                this.startSignalingPoll();
            }
        }

        startSignalingPoll() {
            this.signalingPoll = setInterval(() => {
                this.checkForSignalingMessages();
            }, 500);
        }

        checkForSignalingMessages() {
            const messages = [];
            
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith(`p2p_signal_${this.sessionId}_`)) {
                    const message = JSON.parse(localStorage.getItem(key));
                    if (message.from !== this.userId) {
                        messages.push({ key, message });
                    }
                }
            }

            messages.forEach(({ key, message }) => {
                this.handleSignalingMessage(message);
                localStorage.removeItem(key);
            });
        }

        async handleSignalingMessage(message) {
            try {
                switch (message.type) {
                    case 'offer':
                        await this.handleOffer(message.data.offer);
                        break;
                    case 'answer':
                        await this.handleAnswer(message.data.answer);
                        break;
                    case 'ice-candidate':
                        await this.handleIceCandidate(message.data.candidate);
                        break;
                }
            } catch (error) {
                console.error('Error handling signaling message:', error);
            }
        }

        async handleOffer(offer) {
            try {
                await this.peerConnection.setRemoteDescription(offer);
                const answer = await this.peerConnection.createAnswer();
                await this.peerConnection.setLocalDescription(answer);
                
                this.sendSignalingMessage('answer', { answer: answer });
            } catch (error) {
                console.error('Error handling offer:', error);
            }
        }

        async handleAnswer(answer) {
            try {
                await this.peerConnection.setRemoteDescription(answer);
            } catch (error) {
                console.error('Error handling answer:', error);
            }
        }

        async handleIceCandidate(candidate) {
            try {
                await this.peerConnection.addIceCandidate(candidate);
            } catch (error) {
                console.error('Error handling ICE candidate:', error);
            }
        }

        onPeerConnected() {
            this.isConnected = true;
            this.updateStatus('connected', 'Connected');
            this.enableControls();
            this.elements.connectionStatus.textContent = '✅ Connected to peer';
            this.addMessage('System', '🎉 Connected! You can now chat in real-time.', 'system');
            
            if (this.signalingPoll) {
                clearInterval(this.signalingPoll);
            }
        }

        onPeerDisconnected() {
            this.isConnected = false;
            this.updateStatus('searching', 'Peer disconnected');
            this.disableControls();
            this.elements.connectionStatus.textContent = '❌ Peer disconnected';
            this.addMessage('System', '❌ Peer disconnected.', 'system');
            this.showRetryButton();
        }

        onConnectionFailed() {
            this.addMessage('System', '❌ Connection failed. This might be due to network restrictions.', 'system');
            this.showRetryButton();
        }

        showRetryButton() {
            this.elements.retryBtn.style.display = 'block';
        }

        retryConnection() {
            this.elements.retryBtn.style.display = 'none';
            this.connectionAttempts = 0;
            this.cleanup();
            
            setTimeout(() => {
                this.connectToSignalingServer();
            }, 1000);
        }

        cleanup() {
            if (this.peerConnection) {
                this.peerConnection.close();
                this.peerConnection = null;
            }
            
            if (this.localStream) {
                this.localStream.getTracks().forEach(track => track.stop());
                this.localStream = null;
            }
            
            if (this.signalingPoll) {
                clearInterval(this.signalingPoll);
                this.signalingPoll = null;
            }
            
            if (this.sessionId) {
                localStorage.removeItem(`p2p_session_${this.sessionId}`);
            }
        }

        enableControls() {
            this.elements.messageInput.disabled = false;
            this.elements.messageInput.placeholder = 'Type your message...';
            this.elements.sendBtn.disabled = false;
            this.elements.voiceBtn.disabled = false;
            this.elements.videoBtn.disabled = false;
        }

        disableControls() {
            this.elements.messageInput.disabled = true;
            this.elements.messageInput.placeholder = 'Not connected...';
            this.elements.sendBtn.disabled = true;
            this.elements.voiceBtn.disabled = true;
            this.elements.videoBtn.disabled = true;
        }

        updateStatus(status, text) {
            this.elements.statusIndicator.className = `status-indicator ${status}`;
            this.elements.statusText.textContent = text;
        }

        sendMessage() {
            const input = this.elements.messageInput;
            const message = input.value.trim();
            
            if (message && this.isConnected && this.dataChannel && this.dataChannel.readyState === 'open') {
                this.addMessage('You', message, 'own');
                
                this.dataChannel.send(JSON.stringify({
                    type: 'message',
                    content: message,
                    timestamp: Date.now()
                }));
                
                input.value = '';
            }
        }

        addMessage(sender, content, type) {
            const messagesContainer = this.elements.messages;
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            
            messageDiv.innerHTML = `
                <div class="message-bubble">
                    ${type === 'system' ? content : `<strong>${sender}:</strong> ${content}`}
                </div>
                <div class="message-time">${time}</div>
            `;
            
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        async toggleVoice() {
            try {
                if (!this.isVoiceEnabled) {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        audio: true,
                        video: this.isVideoEnabled 
                    });
                    
                    if (this.localStream) {
                        this.localStream.getTracks().forEach(track => track.stop());
                    }
                    
                    this.localStream = stream;
                    const audioTrack = stream.getAudioTracks()[0];
                    
                    if (this.peerConnection && audioTrack) {
                        this.peerConnection.addTrack(audioTrack, stream);
                    }
                    
                    this.isVoiceEnabled = true;
                    this.elements.voiceBtn.classList.add('active');
                    this.addMessage('System', '🎤 Voice enabled', 'system');
                } else {
                    if (this.localStream) {
                        this.localStream.getAudioTracks().forEach(track => {
                            track.stop();
                            if (this.peerConnection) {
                                const sender = this.peerConnection.getSenders().find(s => s.track === track);
                                if (sender) this.peerConnection.removeTrack(sender);
                            }
                        });
                    }
                    this.isVoiceEnabled = false;
                    this.elements.voiceBtn.classList.remove('active');
                    this.addMessage('System', '🔇 Voice disabled', 'system');
                }
            } catch (error) {
                console.error('Voice toggle error:', error);
                this.addMessage('System', '❌ Could not access microphone', 'system');
            }
        }

        async toggleVideo() {
            try {
                if (!this.isVideoEnabled) {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { width: 1280, height: 720 },
                        audio: this.isVoiceEnabled 
                    });
                    
                    if (this.localStream) {
                        this.localStream.getTracks().forEach(track => track.stop());
                    }
                    
                    this.localStream = stream;
                    this.elements.localVideo.srcObject = stream;
                    this.elements.localVideo.style.display = 'block';
